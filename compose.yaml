# Production stack on the home server, deployed by devbot (see deploy/README.md).
# Took over from Portainer stack 34: same project, service, container, volume
# and port, so the data and the nginx site (bicycle-shop.conf) carry over.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  bike-shop:
    build: ./shopping-app
    image: cartwise-bike-shop:${REVISION:-dev}
    container_name: cartwise
    restart: unless-stopped
    ports:
      - "127.0.0.1:8293:3000"   # host nginx proxies here
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}   # from the server's .env; /admin is off without it
    volumes:
      - bike-shop-data:/data   # SQLite database, uploaded photos, product images (img/)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *logging

volumes:
  # Nightly backup. The live volume (cartwise_bike-shop-data) predates this label and
  # Docker can't add labels to an existing volume, so compose reuses it as is (no
  # recreate: it has no config hash) and it stays in LEGACY_VOLUMES in
  # ~/services/backup/app-dump.sh until it's ever recreated.
  bike-shop-data:
    labels:
      backup: "true"
