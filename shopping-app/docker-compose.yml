# docker compose up -d --build
services:
  bike-shop:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # required to log in at /admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env next to this file}
    volumes:
      - bike-shop-data:/data

volumes:
  bike-shop-data:
